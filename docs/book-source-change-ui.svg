<svg xmlns="http://www.w3.org/2000/svg" width="980" height="900" viewBox="0 0 980 900">
  <rect width="980" height="900" fill="#eef2f7"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172333; }
    .caption { font-size: 22px; font-weight: 700; }
    .title { font-size: 21px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 13px; fill: #687789; }
    .label { font-size: 14px; font-weight: 700; }
    .accent { fill: #2563b3; }
    .white { fill: white; }
  </style>
  <text x="65" y="58" class="caption">01 · 找来源</text>
  <text x="525" y="58" class="caption">02 · 确认切换</text>

  <rect x="55" y="82" width="400" height="754" rx="30" fill="#fff" stroke="#d5dee9" stroke-width="2"/>
