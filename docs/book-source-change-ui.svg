  <text x="130" y="509" class="small">三体 · 刘慈欣 · 最新第 112 章</text>
  <rect x="77" y="547" width="356" height="92" rx="17" fill="#f8fafc" stroke="#dce5f0"/>
  <circle cx="104" cy="578" r="15" fill="#e7f0fb"/>
  <text x="104" y="583" text-anchor="middle" class="small accent">◉</text>
  <text x="130" y="585" class="body" font-weight="700">书源 C</text>
  <rect x="320" y="563" width="84" height="26" rx="13" fill="#fff0dc"/>
  <text x="329" y="581" class="small" fill="#9a5a00">作者不同</text>
  <text x="130" y="613" class="small">三体 · 另一作者</text>
  <text x="77" y="684" class="small">已找到 8 个，暂停查找</text>
  <rect x="77" y="706" width="356" height="54" rx="15" fill="#e8f0fb"/>
  <text x="255" y="740" text-anchor="middle" class="label accent">继续查找其余来源</text>

  <rect x="515" y="82" width="400" height="754" rx="30" fill="#fff" stroke="#d5dee9" stroke-width="2"/>
  <text x="542" y="130" class="body accent">‹</text>
  <text x="715" y="130" class="title" text-anchor="middle">确认切换</text>
  <line x1="515" x2="915" y1="154" y2="154" stroke="#e4e9ef"/>
