  <text x="270" y="380" class="small">共 238 个可用书源</text>
  <rect x="77" y="391" width="356" height="5" rx="3" fill="#e6edf6"/>
  <rect x="77" y="391" width="143" height="5" rx="3" fill="#2563b3"/>
  <text x="77" y="422" class="small accent">停止查找</text>
  <rect x="77" y="443" width="356" height="92" rx="17" fill="#f8fafc" stroke="#dce5f0"/>
  <circle cx="104" cy="474" r="15" fill="#e7f0fb"/>
  <text x="104" y="479" text-anchor="middle" class="small accent">◉</text>
  <text x="130" y="481" class="body" font-weight="700">书源 B</text>
  <rect x="335" y="459" width="69" height="26" rx="13" fill="#e7f5ee"/>
