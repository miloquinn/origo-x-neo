  <text x="220" y="130" class="title" text-anchor="middle">换源</text>
  <line x1="55" x2="455" y1="154" y2="154" stroke="#e4e9ef"/>
  <text x="78" y="191" class="title">三体</text>
  <text x="78" y="218" class="small">刘慈欣 · 当前：书源 A · 读到第 86 章</text>
  <rect x="77" y="244" width="356" height="52" rx="14" fill="#f6f8fb" stroke="#cdd8e6"/>
