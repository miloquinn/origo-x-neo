  <text x="557" y="497" class="body">新：第 87 章 · 黑暗森林</text>
  <text x="557" y="535" class="small accent">按章节标题匹配</text>
  <rect x="537" y="578" width="356" height="83" rx="17" fill="#f3f7fc"/>
  <text x="557" y="609" class="label">切换后</text>
  <text x="557" y="637" class="small">更新书架关联与阅读位置</text>
  <line x1="515" x2="915" y1="703" y2="703" stroke="#e4e9ef"/>
  <rect x="537" y="721" width="356" height="54" rx="15" fill="#2563b3"/>
  <text x="715" y="755" text-anchor="middle" class="label white">确认换到书源 B</text>
  <text x="490" y="873" text-anchor="middle" class="small">结构示意 · 具体颜色随应用主题变化 · 失败与超时状态见交互文档</text>
