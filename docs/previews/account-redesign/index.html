<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Origo X · 登录与账户设计</title>
<style>
:root{font-family: -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20252e;background:#eceef2}*{box-sizing:border-box}body{margin:0}header{max-width:1240px;padding:32px 30px 20px;margin:auto}small{color:#637083;letter-spacing:.12em;font-size:11px}h1{font-size:27px;letter-spacing:-.03em;margin:12px 0}p{font-size:14px;line-height:1.7;color:#627084;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button{border:1px solid #ccd2dd;background:#f7f8fa;padding:10px 15px;border-radius:10px;cursor:pointer;color:inherit;font-size:13px}button[aria-pressed=true]{background:#344f77;color:white;border-color:#344f77}button:focus-visible{outline:3px solid #1d70cc;outline-offset:3px}main{max-width:1240px;margin:auto;padding:8px 30px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}figure{margin:0}figure img{display:block;width:100%;border-radius:24px;border:1px solid #d5d9e1;box-shadow:0 12px 28px #2633480a;background:#faf9ff}figcaption{margin:15px 0 8px;font-size:15px;font-weight:600}figure p{font-size:12px}footer{max-width:1240px;margin:auto;padding:0 30px 28px;color:#68758a;font-size:12px;line-height:1.8}a{color:#365982}body.dark{background:#20242c;color:#eef1f7}body.dark p,body.dark small,body.dark footer{color:#a4b0c2}body.dark button{background:#303844;border-color:#4a5362;color:#edf1f7}body.dark button[aria-pressed=true]{background:#5875a2;border-color:#7d98bf}@media(max-width:760px){main{grid-template-columns:1fr;max-width:450px}h1{font-size:23px}}
</style>
<header><small>ORIGO X / ACCOUNT DESIGN / 01</small><h1>一屏完成一件事。</h1><p>登录更轻，账户更清楚。“已实现”展示正式 Flutter 页面，其他标签保留原设计对照。示例信息不代表真实账户。</p><nav aria-label="设计页面"><button data-set="implemented" aria-pressed="false">已实现 · 正式页面</button><button data-set="overview" aria-pressed="true">整体方向</button><button data-set="auth">登录流程</button><button data-set="register">分步注册</button><button data-set="account">账户管理</button><button data-set="recover">找回与授权</button><button data-set="dark">深色模式</button></nav></header><main id="screens"></main><footer>正常手机每页主操作一屏内；小屏、大字号和键盘弹出时允许必要滚动。<br>正式 UI 已接入，尚未上传新商店包。“已实现”截图来自生产组件；其余为设计原型。应用永久解锁与高级版为两个独立商品，截图价格为美国区已确认定价，实际付款显示商店本地价格。<a href="../../account-ui-redesign.md">设计说明</a></footer>
<script>
const sets={implemented:[['implemented-login','登录入口','邮箱与主要第三方登录；其他方式在底部面板。'],['implemented-password','密码登录','仅显示当前步骤，保留验证码和找回入口。'],['implemented-register-details','注册 · 设置账户','用户名、密码、确认密码在一屏内。'],['implemented-account-premium','用户中心','身份与清晰分组入口；官网版保留邀请。'],['implemented-security','账户安全','邮箱、密码、双重验证与绑定方式分别管理。'],['implemented-login-dark','深色登录','跟随主题。'],['production-membership/premium-membership-phone-light','账号与权益 · 未购买','购买与恢复前置；此图价格由测试商店返回，仅作布局验证。'],['production-membership/premium-active-phone-dark','账号与权益 · 已购','保留恢复入口，权益说明放在后面。']],overview:[['login','01 · 登录','去掉重复介绍卡，只留下邮箱与主要登录方式。'],['premium-account','02 · 账户','身份卡与分组入口，高级版仅显示紧凑徽章。'],['security','03 · 安全','只展示状态，具体修改进入独立页面。']],auth:[['login','选择登录方式','其他方式在原生底部面板中选择。'],['password','输入密码','不再重复第三方登录和长说明。'],['code','邮箱验证码','一个输入区域，支持粘贴与自动填充。']],register:[['register','1 / 3 · 邮箱','先发送验证码。'],['register-code','2 / 3 · 验证码','收集验证码，最终提交时验证。'],['register-finish','3 / 3 · 设置账户','用户名与密码，头像和昵称稍后补充。']],account:[['account','账户概览','准确区分试用、永久、旧用户与同步失败。'],['profile','个人资料','头像、昵称与用户名集中编辑。'],['membership','阅读使用权','价格与购买前置，恢复购买清晰可见。']],recover:[['reset','找回密码','先确认接收验证码的邮箱。'],['reset-finish','设置新密码','验证与重置完成后返回登录。'],['authorization','外部授权','明确等待、重新打开与取消。']],dark:[['login-dark','深色 · 登录','继续跟随系统与用户主题。'],['premium-account-dark','深色 · 账户','低对比表面与克制的金色身份细节。']]};
sets.implemented.splice(6,1,['implemented/apple-reader-unlock-1290x2796','应用永久解锁 · US$9.99','免登录试用、购买和恢复；只解锁应用阅读。'],['implemented/apple-premium-1290x2796','永久高级版 · US$8.99','应用永久解锁后显示；购买验证后绑定当前 Origo 账号。']);
function show(name){document.body.classList.toggle('dark',name==='dark');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.set===name)));const main=document.querySelector('main');main.replaceChildren();sets[name].forEach(([file,title,description])=>{const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption'),p=document.createElement('p');img.src=file+'.png';img.alt=title;cap.textContent=title;p.textContent=description;f.append(img,cap,p);main.append(f)});location.hash=name;}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.set)));show(sets[location.hash.slice(1)]?location.hash.slice(1):'overview');
</script></html>
