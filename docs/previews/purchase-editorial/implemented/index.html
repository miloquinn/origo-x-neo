<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origo · Flutter 实现</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#dedfd8;color:#24392f;font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{max-width:1040px;margin:0 auto 24px}h1{font-size:24px;font-weight:500;margin:0 0 8px}p{margin:0;color:#61705f}a{color:#355a3e}main{display:flex;flex-wrap:wrap;justify-content:center;gap:32px}figure{margin:0;width:min(390px,100%)}figcaption{margin-bottom:12px}img{display:block;width:100%;border-radius:22px;box-shadow:0 16px 40px #26342b22}nav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #aebda4;border-radius:8px;background:#f6f4ed;color:#24392f;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2d493b;color:#f6f4ed}button:focus-visible{outline:3px solid #bd9364}</style><header><h1>已实现 · 购买界面</h1><p>正式 Flutter 组件的实际渲染。可切换基础版三种场景和深色模式；下方图片不触发购买。</p><nav aria-label="查看基础版场景"><button data-file="basic-phone-light.png" aria-pressed="true">阅读与排版</button><button data-file="basic-scene-1.png" aria-pressed="false">听书与 AI</button><button data-file="basic-scene-2.png" aria-pressed="false">记录与备份</button><button data-file="basic-phone-dark.png" aria-pressed="false">深色模式</button></nav><p>示例价格与账号用于渲染验证。尚未发布新的商店测试包。<a href="../index.html">对照已批准的视觉提案</a></p></header><main><figure><figcaption>基础版 · 完整阅读体验</figcaption><img id="basic" src="basic-phone-light.png" alt="Flutter基础版购买页实际渲染"></figure><figure><figcaption>高级版 · 进阶扩展</figcaption><img src="premium-phone-light.png" alt="Flutter高级版购买页实际渲染"></figure></main><script>document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{document.querySelector('#basic').src=b.dataset.file;document.querySelectorAll('[data-file]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></html>
