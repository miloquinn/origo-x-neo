    <rect x="126" y="806" width="30" height="30" rx="9" fill="#F1F3F5"/><text x="141" y="822" class="icon" fill="#68798B">ⓘ</text>
    <text x="171" y="816" class="row">关于与支持</text><text x="171" y="836" class="small">版本、更新、开源项目</text><text x="441" y="828" class="chevron">›</text>

    <rect x="92" y="869" width="390" height="75" fill="#FFFFFF"/>
    <line x1="92" y1="869" x2="482" y2="869" stroke="#E5EBF0"/>
    <text x="130" y="900" class="icon" fill="#8B9AAA">⌂</text><text x="130" y="921" text-anchor="middle" class="small">首页</text>
    <text x="207" y="900" class="icon" fill="#8B9AAA">▥</text><text x="207" y="921" text-anchor="middle" class="small">书库</text>
    <text x="284" y="900" class="icon" fill="#8B9AAA">◇</text><text x="284" y="921" text-anchor="middle" class="small">发现</text>
    <text x="361" y="900" class="icon" fill="#8B9AAA">✦</text><text x="361" y="921" text-anchor="middle" class="small">AI</text>
    <text x="439" y="900" class="icon" fill="#2870A8">●</text><text x="439" y="921" text-anchor="middle" font-size="12" font-weight="700" fill="#2870A8">我的</text>
  </g>

  <rect x="636" y="118" width="394" height="828" rx="34" fill="#FFFFFF" stroke="#D8E2EB" stroke-width="2" filter="url(#deviceShadow)"/>
  <g clip-path="url(#rightClip)">
