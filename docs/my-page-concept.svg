    <rect x="846" y="385" width="65" height="34" rx="10" fill="#F5F7F9"/>
    <text x="878" y="407" text-anchor="middle" font-size="12" fill="#667A8C">深色</text>
    <line x1="675" y1="438" x2="991" y2="438" stroke="#ECF0F3"/>
    <text x="675" y="470" class="row">字体与字号</text><text x="989" y="470" class="chevron">›</text>

    <text x="660" y="539" class="section">阅读</text>
