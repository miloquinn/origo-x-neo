    <text x="675" y="612" class="small">从上次阅读的位置继续</text>
    <rect x="944" y="573" width="48" height="28" rx="14" fill="#3E83B8"/><circle cx="977" cy="587" r="11" fill="#FFFFFF"/>
    <line x1="675" y1="627" x2="991" y2="627" stroke="#ECF0F3"/>
    <text x="675" y="659" class="row">音量键翻页</text>
    <rect x="944" y="641" width="48" height="28" rx="14" fill="#D8E0E7"/><circle cx="958" cy="655" r="11" fill="#FFFFFF"/>
    <line x1="675" y1="681" x2="991" y2="681" stroke="#ECF0F3"/>
    <text x="675" y="717" class="row">阅读器顶部栏</text><text x="987" y="717" font-size="12" fill="#7A8A99" text-anchor="end">跟随阅读主题  ›</text>

    <text x="660" y="784" class="section">应用</text>
    <rect x="656" y="800" width="354" height="91" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="675" y="836" class="row">语言</text><text x="989" y="836" font-size="12" fill="#7A8A99" text-anchor="end">简体中文  ›</text>
    <line x1="675" y1="852" x2="991" y2="852" stroke="#ECF0F3"/>
    <text x="675" y="879" class="row">书架与导航布局</text><text x="989" y="879" class="chevron">›</text>
