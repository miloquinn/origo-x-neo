    <text x="662" y="150" font-size="13" font-weight="700">9:41</text>
    <rect x="969" y="138" width="18" height="9" rx="2" fill="#1B2D40"/><rect x="989" y="140" width="3" height="5" rx="1" fill="#1B2D40"/>
    <text x="662" y="198" font-size="25" font-weight="400" fill="#397AAB">‹</text>
    <text x="684" y="197" font-size="14" font-weight="680" fill="#397AAB">我的</text>
