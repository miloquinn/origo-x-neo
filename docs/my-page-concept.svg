    <line x1="162" y1="663" x2="448" y2="663" stroke="#ECF0F3"/>
    <line x1="162" y1="726" x2="448" y2="726" stroke="#ECF0F3"/>
    <line x1="162" y1="789" x2="448" y2="789" stroke="#ECF0F3"/>
    <rect x="126" y="617" width="30" height="30" rx="9" fill="#E8F2FB"/><text x="141" y="633" class="icon" fill="#367AB2">◐</text>
    <text x="171" y="627" class="row">偏好设置</text><text x="171" y="647" class="small">外观、阅读、语言</text><text x="441" y="639" class="chevron">›</text>
    <rect x="126" y="680" width="30" height="30" rx="9" fill="#E8F5F2"/><text x="141" y="696" class="icon" fill="#388A78">↻</text>
    <text x="171" y="690" class="row">数据与同步</text><text x="171" y="710" class="small">WebDAV、缓存管理</text><text x="441" y="702" class="chevron">›</text>
    <rect x="126" y="743" width="30" height="30" rx="9" fill="#F1EDFA"/><text x="141" y="759" class="icon" fill="#7C6BB0">✦</text>
