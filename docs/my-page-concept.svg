<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title desc">
  <title id="title">Origo X 我的页面概念稿</title>
  <desc id="desc">左侧是我的首页，右侧是偏好设置二级页，展示账户、高级版、设置分类和阅读偏好。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EAF0F6"/></linearGradient>
    <linearGradient id="premium" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142846"/><stop offset="1" stop-color="#263D5B"/></linearGradient>
    <linearGradient id="avatar" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#DCEAF6"/><stop offset="1" stop-color="#B5D4EF"/></linearGradient>
    <filter id="deviceShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1B3450" flood-opacity=".14"/></filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#2A4663" flood-opacity=".07"/></filter>
    <clipPath id="leftClip"><rect x="92" y="120" width="390" height="824" rx="32"/></clipPath>
    <clipPath id="rightClip"><rect x="638" y="120" width="390" height="824" rx="32"/></clipPath>
    <style>
      text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
      text:not([fill]) {fill:#1B2D40}
      .small {font-size:12px;fill:#69798A}.label {font-size:14px;font-weight:700}.muted {fill:#68798B}.title {font-size:30px;font-weight:800;letter-spacing:-1px}.section {font-size:13px;font-weight:700;letter-spacing:1px;fill:#748397}.row {font-size:16px;font-weight:680}.chevron {font-size:26px;fill:#A4B2BF;font-weight:300}.icon {font-size:19px;font-weight:600;dominant-baseline:middle;text-anchor:middle}
    </style>
  </defs>
  <rect width="1120" height="1010" fill="url(#paper)"/>
  <circle cx="65" cy="104" r="170" fill="#DFEAF5" opacity=".45"/>
  <circle cx="1080" cy="960" r="220" fill="#DCE8F4" opacity=".45"/>
  <text x="90" y="60" font-size="14" font-weight="800" fill="#376E9D" letter-spacing="2">ORIGO X  ·  页面改版概念</text>
  <text x="90" y="88" font-size="14" fill="#65798C">账户与权益在前，设置按任务归位</text>
  <text x="92" y="978" class="small">01  我的首页</text>
  <text x="638" y="978" class="small">02  偏好设置 · 二级页直接操作</text>

  <rect x="90" y="118" width="394" height="828" rx="34" fill="#FFFFFF" stroke="#D8E2EB" stroke-width="2" filter="url(#deviceShadow)"/>
  <g clip-path="url(#leftClip)">
    <rect x="92" y="120" width="390" height="824" fill="#F6F8FA"/>
    <text x="116" y="150" font-size="13" font-weight="700">9:41</text>
    <rect x="423" y="138" width="18" height="9" rx="2" fill="#1B2D40"/><rect x="443" y="140" width="3" height="5" rx="1" fill="#1B2D40"/>
    <text x="116" y="210" class="title">我的</text>
    <text x="117" y="237" font-size="13" class="muted">你的阅读空间</text>

    <rect x="110" y="259" width="354" height="106" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <circle cx="151" cy="310" r="27" fill="url(#avatar)"/>
    <text x="151" y="313" class="icon" fill="#245B89">人</text>
    <text x="193" y="299" font-size="17" font-weight="750">未登录</text>
    <text x="193" y="323" class="small">本地阅读无需登录</text>
    <text x="193" y="345" font-size="12" font-weight="700" fill="#2870A8">登录 / 管理账号</text>
    <text x="437" y="319" class="chevron">›</text>

    <rect x="110" y="382" width="354" height="164" rx="22" fill="url(#premium)"/>
    <path d="M403 382L464 382L464 455Q421 440 403 382Z" fill="#E7BF78" opacity=".13"/>
    <circle cx="428" cy="503" r="73" fill="none" stroke="#EBCB90" stroke-opacity=".18" stroke-width="1"/>
    <circle cx="428" cy="503" r="53" fill="none" stroke="#EBCB90" stroke-opacity=".16" stroke-width="1"/>
    <text x="130" y="410" font-size="11" font-weight="800" letter-spacing="2" fill="#E8C995">ORIGO X · 高级版</text>
