    <text x="130" y="472" font-size="12" fill="#D8E0EA">书源扩展与私有网络访问</text>
    <rect x="130" y="493" width="124" height="35" rx="10" fill="#F1D49E"/>
    <text x="192" y="516" text-anchor="middle" font-size="12" font-weight="760" fill="#1C304A">查看权益  ↗</text>

