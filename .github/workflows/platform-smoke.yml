name: Cross-platform smoke builds

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/platform-smoke.yml"
      - "assets/**"
      - "ios/**"
      - "lib/**"
      - "linux/**"
      - "macos/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "shaders/**"
      - "tool/patch_passkeys_darwin.py"
      - "windows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-smoke.yml"
      - "assets/**"
      - "ios/**"
      - "lib/**"
      - "linux/**"
      - "macos/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "shaders/**"
      - "tool/patch_passkeys_darwin.py"
      - "windows/**"
  schedule:
    # Monday 02:17 in Asia/Shanghai (Sunday 18:17 UTC).
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  linux:
    name: Product build / Linux x64 release
    # desktop_webview_window requires WebKitGTK 4.0, which is available on
    # Ubuntu 22.04 but removed from the ubuntu-latest image.
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev libsoup-3.0-dev \
            liblzma-dev libglu1-mesa libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Patch Linux WebView cookie expiry compatibility
        shell: bash
        run: |
          set -euo pipefail
          plugin_source="$(
            find "$PUB_CACHE/hosted/pub.dev" \
              -path '*/desktop_webview_window-*/linux/webview_window.cc' \
              -print -quit
          )"
          test -n "$plugin_source"
          # Ubuntu 22.04 selects the plugin's WebKitGTK 4.0 fallback, whose
          # soup_cookie_get_expires() returns SoupDate rather than GDateTime.
          if grep -Fq 'g_date_time_get_seconds(' "$plugin_source"; then
            sed -i 's/g_date_time_get_seconds(/soup_date_to_time_t(/' "$plugin_source"
          fi
          grep -Fq 'soup_date_to_time_t(' "$plugin_source"

      - name: Product build / Linux x64 release
        run: flutter build linux --release

  windows:
    name: Product build / Windows x64 release
    # pdfx's PDFium downloader is not compatible with CMake 4 on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Ensure NuGet is available
        shell: pwsh
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }

      - name: Product build / Windows x64 release
        run: flutter build windows --release

  apple:
    name: Product build / Apple release builds (unsigned)
    runs-on: macos-15
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Patch passkeys_darwin for Xcode 16
        run: python3 tool/patch_passkeys_darwin.py

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Product build / macOS release
        run: flutter build macos --release

      - name: Product build / iOS release without code signing
        run: flutter build ios --release --no-codesign
